name: Independent PR Code Quality Review
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  independent-ai-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Code quality review (fail closed on non-PASS)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          ALLOW_EXTERNAL_AI_REVIEW: ${{ vars.ALLOW_EXTERNAL_AI_REVIEW }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python automation/pr_review.py
      - name: Publish review comment, even if blocked
        if: always() && hashFiles('review_output.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('review_output.json','utf8'));
            const parts = [
              `### Usayd PR Review: ${result.status}`,
              result.error || '',
              ...result.findings.slice(0, 15).map(x => `- **${x.severity}** \`${x.file}\`: ${x.message} — ${x.suggested_fix || ''}`),
              '',
              `> ${result.governance_note || ''}`
            ];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: parts.filter(Boolean).join('\n').slice(0, 60000)
            });
