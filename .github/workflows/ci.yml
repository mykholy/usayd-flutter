name: Flutter CI
on:
  pull_request:
  push:
    branches: [dev, staging, main]
  merge_group:
permissions:
  contents: read
jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check repository bootstrap state
        id: state
        run: |
          if [ -f pubspec.yaml ]; then
            echo "is_bootstrapped=true" >> $GITHUB_OUTPUT
            echo "Flutter application detected (pubspec.yaml present)."
          else
            echo "is_bootstrapped=false" >> $GITHUB_OUTPUT
            echo "Pre-bootstrap repository state detected (pubspec.yaml absent)."
          fi

      # Phase A: Pre-bootstrap verification
      - name: Set up Python for pre-bootstrap governance verification
        if: steps.state.outputs.is_bootstrapped == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run repository governance & configuration integrity tests
        if: steps.state.outputs.is_bootstrapped == 'false'
        run: |
          if [ -f scripts/verify_repository_governance.py ]; then
            python scripts/verify_repository_governance.py
          fi
          python -c "import json, glob; [json.load(open(f)) for f in glob.glob('**/*.json', recursive=True) if 'node_modules' not in f and '.git' not in f and '.dart_tool' not in f and 'build' not in f and 'android' not in f]; print('All JSON configurations verified successfully.')"
          echo "Pre-bootstrap verification passed. Full Flutter test battery will activate upon USYD-T0075."

      # Phase B: Post-bootstrap verification (Flutter SDK)
      - name: Set up Flutter SDK
        if: steps.state.outputs.is_bootstrapped == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0

      - name: Install dependencies
        if: steps.state.outputs.is_bootstrapped == 'true'
        run: flutter pub get

      - name: Check code formatting
        if: steps.state.outputs.is_bootstrapped == 'true'
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project code
        if: steps.state.outputs.is_bootstrapped == 'true'
        run: flutter analyze

      - name: Run unit & widget tests
        if: steps.state.outputs.is_bootstrapped == 'true'
        run: flutter test

