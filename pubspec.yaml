name: usayd_flutter
description: "Usayd Academy — Mobile Learning App"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.10.7
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  go_router: ^17.5.0
  crypto: ^3.0.8
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:


  uses-material-design: true

  assets:
    - assets/icons/
    - assets/illustrations/

  